{% extends "base.html" %}
{% load static %}
{% block title %}Send files — SafePassage{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-8 col-lg-6">
    <section class="upload-panel card shadow-lg border-0" style="border-top: 5px solid #90EE90 !important; border-radius: 12px;">
      <div class="card-body p-5">
        <h1 class="h3 fw-bold text-center text-dark-gray mb-2">Send files up to 200&nbsp;MB</h1>
        <p class="text-center text-muted mb-4">Upload, get a link, share it however you like.</p>

        {% csrf_token %}
        
        <div id="dropzone" class="dropzone border border-2 border-dashed rounded bg-light p-5 text-center mb-4" style="border-style: dashed !important; border-color: #E6E6FA !important; cursor: pointer; transition: background-color 0.2s;">
          <div class="mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#90EE90" class="bi bi-cloud-arrow-up" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708z"/>
              <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
            </svg>
          </div>
          <p class="mb-0 text-muted fw-semibold">Drag files here or click to browse</p>
          <input type="file" id="file-input" multiple hidden>
        </div>

        <div id="file-list" class="mb-4"></div>

        <div class="d-grid">
          <button id="upload-btn" class="btn btn-theme py-2 fs-5" disabled>Get a link</button>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="{% static 'js/upload.js' %}"></script>
{% endblock %}
