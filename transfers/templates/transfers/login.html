{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0" style="background-color: #ffffff; border-top: 5px solid #90EE90 !important;">
                <div class="card-body p-4" style="background-color: #F8F9FA;">
                    
                    <h2 class="text-center mb-4" style="color: #4a4a4a; background-color: #E6E6FA; padding: 10px; border-radius: 5px;">
                        Welcome Back
                    </h2>
                    
                    <p class="text-center text-muted mb-4">Log in to manage your active transfer links.</p>

                    <form method="POST">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn fw-bold" style="background-color: #90EE90; color: #2c3e50;">
                                Log In
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <small>Don't have an account? <a href="{% url 'transfers:register' %}" style="color: #6c757d;">Register here</a>.</small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
