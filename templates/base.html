{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SafePassage{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <a href="{% url 'transfers:home' %}" class="logo">SafePassage</a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'transfers:dashboard' %}">Dashboard</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Files are deleted automatically after they expire.</p>
  </footer>
</body>
</html>
